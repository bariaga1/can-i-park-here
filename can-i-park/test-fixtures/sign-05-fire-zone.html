<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .sign {
      width: 420px;
      background: #c1121f;
      border: 16px solid #fff;
      border-radius: 12px;
      padding: 36px 24px;
      text-align: center;
      font-family: Arial Black, Arial, Helvetica, sans-serif;
      color: #fff;
    }
    h1 { font-size: 42px; margin: 0 0 16px; letter-spacing: 2px; }
    p { font-size: 32px; margin: 8px 0; font-weight: 700; }
  </style>
</head>
<body>
  <div class="sign">
    <h1>NO PARKING</h1>
    <p>FIRE ZONE</p>
  </div>
</body>
</html>
